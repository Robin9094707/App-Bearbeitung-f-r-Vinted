name: Android APK

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK-Pakete installieren
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Glanzstueck-${{ github.run_number }}.apk"
          ls -la dist

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Glanzstueck-APK
          path: dist/*.apk
          retention-days: 30

      - name: Release veröffentlichen
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glanzstück Build ${{ github.run_number }}
          body: |
            Android-APK von Glanzstück (automatisch gebaut).
            Herunterladen, auf dem Handy öffnen und installieren.
          files: dist/*.apk
          prerelease: false
          make_latest: true
